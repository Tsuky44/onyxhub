# Vérifie chaque push et chaque PR, puis construit l'image Docker.
# L'image est publiée sur GHCR (ghcr.io/<propriétaire>/onyxhub) pour la branche
# par défaut (`latest`) et les tags `v*` (`1.2.3`, `1.2`) ; une PR la construit sans la publier.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verifier:
    name: Lint, types et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Version de pnpm lue dans `packageManager` (package.json).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  image:
    name: Image Docker
    needs: verifier
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # arm64 pour un NAS ou un Raspberry Pi, amd64 pour le reste (Unraid compris).
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Connexion à GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action passe le nom en minuscules, comme l'exige un registre Docker.
          images: ghcr.io/${{ github.repository_owner }}/onyxhub
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
      - name: Construction (et publication hors PR)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
